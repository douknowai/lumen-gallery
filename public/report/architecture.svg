<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#a67c3d"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7a6a55"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1440" height="1060" fill="#f7f2e7"/>
  <text x="720" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#2b2620">LUMEN 流明 · 3D 虚拟展览馆 — 系统架构图</text>
  <text x="720" y="84" text-anchor="middle" font-size="15" fill="#8a7a5f">Vite 7 + React 19 + TypeScript 5 + Three.js（R3F）+ Zustand + Node（coze-coding-dev-sdk）</text>

  <!-- ============ 层 1：前端展示与交互层 ============ -->
  <rect x="80" y="120" width="1280" height="210" rx="12" fill="#ffffff" stroke="#a67c3d" stroke-width="1.6"/>
  <rect x="80" y="120" width="1280" height="40" rx="12" fill="#a67c3d"/>
  <text x="100" y="146" font-size="18" font-weight="700" fill="#ffffff">① 前端展示与交互层（浏览器 · React 19 + R3F）</text>

  <rect x="104" y="176" width="290" height="66" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="249" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2620">3D 场景子系统</text>
  <text x="249" y="224" text-anchor="middle" font-size="12" fill="#6f6352">Gallery · 建筑 · 展品 · 灯光 · 相机</text>

  <rect x="424" y="176" width="290" height="66" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="569" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2620">交互与控制系统</text>
  <text x="569" y="224" text-anchor="middle" font-size="12" fill="#6f6352">行走/碰撞 · 区域判定 · 聚焦交互</text>

  <rect x="744" y="176" width="290" height="66" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="889" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2620">UI 与 HUD 层</text>
  <text x="889" y="224" text-anchor="middle" font-size="12" fill="#6f6352">弹窗 · 通话 · 导览员 · 小地图 · 灯箱</text>

  <rect x="1064" y="176" width="272" height="66" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="1200" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2620">AI 前端封装 lib/ai.ts</text>
  <text x="1200" y="224" text-anchor="middle" font-size="12" fill="#6f6352">分句 TTS · 对话历史持久化</text>

  <rect x="104" y="254" width="1232" height="60" rx="8" fill="#f3ecda" stroke="#d8c9a8"/>
  <text x="720" y="279" text-anchor="middle" font-size="14" fill="#6f6352">Zustand 状态机（loading → ready → entering → explore ⇄ modal ⇄ call ⇄ lightbox ⇄ characters）　·　中英双语字典 lib/i18n.ts　·　性能预算 site.ts</text>
  <text x="720" y="300" text-anchor="middle" font-size="13" fill="#8a7a5f">同屏射灯灯光预算 · 移动端 pixelRatio 降级 · 弹窗降帧 · 首屏资源预加载优化</text>

  <!-- 箭头 1 → 2 -->
  <line x1="720" y1="330" x2="720" y2="362" stroke="#a67c3d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="736" y="352" font-size="12" fill="#a67c3d">HTTP / JSON · SSE 流式（fetch Reader 打字机渲染）</text>

  <!-- ============ 层 2：Node 后端服务层 ============ -->
  <rect x="80" y="364" width="1280" height="190" rx="12" fill="#ffffff" stroke="#7a6a55" stroke-width="1.6"/>
  <rect x="80" y="364" width="1280" height="40" rx="12" fill="#7a6a55"/>
  <text x="100" y="390" font-size="18" font-weight="700" fill="#ffffff">② Node 后端服务层（api.mjs · 纯 JS / ESM）</text>

  <rect x="104" y="420" width="232" height="60" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="220" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">/api/ai/narrate</text>
  <text x="220" y="468" text-anchor="middle" font-size="12" fill="#6f6352">口播稿 · 图片展品多模态看图</text>

  <rect x="360" y="420" width="232" height="60" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="476" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">/api/ai/chat</text>
  <text x="476" y="468" text-anchor="middle" font-size="12" fill="#6f6352">展品对话 · SSE 流式</text>

  <rect x="616" y="420" width="232" height="60" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="732" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">/api/ai/guide</text>
  <text x="732" y="468" text-anchor="middle" font-size="12" fill="#6f6352">AI 总导览员 · SSE 流式</text>

  <rect x="872" y="420" width="232" height="60" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="988" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">/api/ai/tts</text>
  <text x="988" y="468" text-anchor="middle" font-size="12" fill="#6f6352">文本转语音 · 分段合成</text>

  <rect x="1128" y="420" width="208" height="60" rx="8" fill="#faf6ec" stroke="#c9b48a"/>
  <text x="1232" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">/api/ai/asr</text>
  <text x="1232" y="468" text-anchor="middle" font-size="12" fill="#6f6352">语音识别 · base64/URL</text>

  <rect x="104" y="496" width="1232" height="44" rx="8" fill="#f3ecda" stroke="#d8c9a8"/>
  <text x="720" y="523" text-anchor="middle" font-size="13" fill="#6f6352">展品信息前端透传（零文件依赖）· 展品「人格」system prompt 注入 · 图片转 base64 供多模态 · 请求头转发鉴权</text>

  <!-- 箭头 2 → 3 -->
  <line x1="720" y1="554" x2="720" y2="586" stroke="#7a6a55" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="736" y="576" font-size="12" fill="#7a6a55">coze-coding-dev-sdk（仅后端调用 · 密钥环境变量注入）</text>

  <!-- ============ 层 3：AI 能力层 ============ -->
  <rect x="80" y="590" width="1280" height="170" rx="12" fill="#ffffff" stroke="#a63d2f" stroke-width="1.6"/>
  <rect x="80" y="590" width="1280" height="40" rx="12" fill="#a63d2f"/>
  <text x="100" y="616" font-size="18" font-weight="700" fill="#ffffff">③ AI 能力层（豆包大模型 · 经 SDK 统一调度）</text>

  <rect x="104" y="646" width="392" height="72" rx="8" fill="#fdf1ee" stroke="#d99c94"/>
  <text x="300" y="674" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2620">LLM 大语言模型</text>
  <text x="300" y="698" text-anchor="middle" font-size="12" fill="#6f6352">doubao-seed-1.8（对话/导览）· doubao-seed-1.8 多模态（看图讲解）· 流式输出</text>

  <rect x="520" y="646" width="392" height="72" rx="8" fill="#fdf1ee" stroke="#d99c94"/>
  <text x="716" y="674" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2620">TTS 语音合成</text>
  <text x="716" y="698" text-anchor="middle" font-size="12" fill="#6f6352">精选音色（小荷/灿灿/云舟/一尘）· 前端分句并发合成按队列顺序播放</text>

  <rect x="936" y="646" width="392" height="72" rx="8" fill="#fdf1ee" stroke="#d99c94"/>
  <text x="1132" y="674" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2620">ASR 语音识别</text>
  <text x="1132" y="698" text-anchor="middle" font-size="12" fill="#6f6352">观众语音转文字（按住说话 / 免提 VAD）· 前端 WAV 编码</text>

  <!-- 箭头 3 → 4 -->
  <line x1="720" y1="760" x2="720" y2="792" stroke="#7a6a55" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="736" y="782" font-size="12" fill="#7a6a55">数据驱动 · 换展改配置不改代码</text>

  <!-- ============ 层 4：数据与资源层 ============ -->
  <rect x="80" y="796" width="1280" height="130" rx="12" fill="#ffffff" stroke="#8a7a5f" stroke-width="1.6"/>
  <rect x="80" y="796" width="1280" height="40" rx="12" fill="#8a7a5f"/>
  <text x="100" y="822" font-size="18" font-weight="700" fill="#ffffff">④ 数据与资源层（数据驱动 · 零硬编码内容）</text>

  <rect x="104" y="852" width="376" height="60" rx="8" fill="#f3ecda" stroke="#d8c9a8"/>
  <text x="292" y="880" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">exhibits.json</text>
  <text x="292" y="900" text-anchor="middle" font-size="12" fill="#6f6352">展品 · 展区 · 出生点 · 文案（中英双语）</text>

  <rect x="504" y="852" width="376" height="60" rx="8" fill="#f3ecda" stroke="#d8c9a8"/>
  <text x="692" y="880" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">characters.json</text>
  <text x="692" y="900" text-anchor="middle" font-size="12" fill="#6f6352">多角色系统 · 切换持久化</text>

  <rect x="904" y="852" width="432" height="60" rx="8" fill="#f3ecda" stroke="#d8c9a8"/>
  <text x="1120" y="880" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">静态资源 assets/</text>
  <text x="1120" y="900" text-anchor="middle" font-size="12" fill="#6f6352">艺术图 · 视频 · GLB 模型 · 程序化纹理</text>

  <!-- 运行时信息 -->
  <rect x="80" y="952" width="1280" height="66" rx="10" fill="#2b2620"/>
  <text x="720" y="982" text-anchor="middle" font-size="14" fill="#f7f2e7">运行环境：端口由 DEPLOY_RUN_PORT 环境变量注入 · 多 worktree 预览隔离 · 生产环境前后端共用端口 5000</text>
  <text x="720" y="1004" text-anchor="middle" font-size="13" fill="#c9b48a">性能预算：同屏投影光源 ≤ 4 · 射灯就近激活 · 移动端 pixelRatio ≤ 1.5 且关闭射灯阴影 · 弹窗降帧 30fps</text>
</svg>